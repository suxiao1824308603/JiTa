<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结构变体测试表单</title>
  <style>
    body { margin: 0; padding: 32px 20px; background: #f3f5fa; color: #0f172a;
      font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .sheet { max-width: 820px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; padding: 26px 30px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 20px; color: #64748b; font-size: 12px; }
    h2 { margin: 24px 0 10px; padding-top: 14px; border-top: 1px solid #eef2f8; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th { width: 120px; padding: 8px 0; text-align: left; vertical-align: middle;
      font-weight: 500; color: #334155; font-size: 13px; }
    td { padding: 8px 10px 8px 0; }
    input[type="text"], input[type="month"], select {
      width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid #d7dfec; border-radius: 8px;
      font: inherit; font-size: 13px; background: #fff;
    }
    .row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
    .row label { color: #334155; font-size: 13px; }
    .ant-form-item { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
    .ant-form-item-label label { color: #334155; font-size: 13px; }
    .ant-radio-group { display: flex; gap: 16px; }
    .ant-radio-wrapper { position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .ant-radio { position: relative; width: 16px; height: 16px; border: 1px solid #cbd5e1; border-radius: 50%; display: inline-block; }
    .ant-radio-input { position: absolute; inset: 0; opacity: 0; width: 16px; height: 16px; margin: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>结构变体测试</h1>
    <p class="sub">覆盖表格布局、占位符、英文标签、隐藏原生单选框、跨章节同名「开始时间」。</p>

    <h2>基本信息</h2>
    <table>
      <tr>
        <th>姓名</th>
        <td><input type="text" name="v_name" id="v_name"></td>
        <th>手机号码</th>
        <td><input type="text" name="v_phone" id="v_phone" placeholder="请输入手机号"></td>
      </tr>
      <tr>
        <th>电子邮箱</th>
        <td><input type="text" name="v_email" id="v_email"></td>
        <th></th>
        <td></td>
      </tr>
    </table>

    <div class="ant-form-item">
      <div class="ant-form-item-label"><label>性别</label></div>
      <div class="ant-radio-group">
        <label class="ant-radio-wrapper">
          <span class="ant-radio"><input type="radio" class="ant-radio-input" name="v_gender" value="male"></span>
          <span>男</span>
        </label>
        <label class="ant-radio-wrapper">
          <span class="ant-radio"><input type="radio" class="ant-radio-input" name="v_gender" value="female"></span>
          <span>女</span>
        </label>
      </div>
    </div>

    <div class="row">
      <label for="v_fullname">Full Name</label>
      <input type="text" id="v_fullname" name="v_fullname">
    </div>

    <h2>教育背景</h2>
    <div class="row">
      <label for="v_school">毕业院校</label>
      <input type="text" id="v_school" name="v_school">
    </div>
    <div class="row">
      <span></span>
      <input type="text" id="v_major" name="v_major" placeholder="请输入专业名称">
    </div>
    <div class="row">
      <label for="v_start">开始时间</label>
      <input type="month" id="v_start" name="v_start">
    </div>

    <h2>实习经历</h2>
    <div class="row">
      <label for="v_company">公司名称</label>
      <input type="text" id="v_company" name="v_company">
    </div>
    <div class="row">
      <label for="v_int_start">开始时间</label>
      <input type="month" id="v_int_start" name="v_int_start">
    </div>
  </div>

  <script>
    window.__variantData = () => {
      const out = {};
      document.querySelectorAll('input, select').forEach((el) => {
        if (el.type === 'radio') {
          if (el.checked) out[el.name] = el.value;
          return;
        }
        out[el.name || el.id] = el.value;
      });
      return out;
    };
  </script>
</body>
</html>
