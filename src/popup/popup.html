<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简填 · 网申助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../../icons/icon48.png" alt="" width="36" height="36">
      <div class="brand-text">
        <h1>简填 · 网申助手</h1>
        <p>本地保存 · 一键填表</p>
      </div>
    </div>
    <button id="openOptions" class="icon-btn" title="打开设置" aria-label="打开设置">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <section class="profile">
    <div class="profile-row">
      <span id="profileName" class="profile-name">未填写简历</span>
      <span id="percent" class="percent">0%</span>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <p id="missing" class="hint">完善资料后，一键填写更准确</p>
  </section>

  <button id="fillBtn" class="primary">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>
    </svg>
    <span>一键填写当前页面</span>
  </button>

  <div class="grid">
    <button id="aiBtn" class="secondary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3 1.9 5.8L20 10.7l-5.2 3.8L16.6 21 12 17.3 7.4 21l1.8-6.5L4 10.7l6.1-1.9L12 3z"></path>
      </svg>
      <span>回答开放题</span>
    </button>
    <button id="scanBtn" class="secondary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <span>检测字段</span>
    </button>
  </div>

  <label class="auto">
    <div>
      <strong>本站自动填写</strong>
      <span id="host">—</span>
    </div>
    <input type="checkbox" id="autoToggle" aria-label="本站自动填写">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <p id="status" class="status hidden"></p>

  <section id="diag" class="diag hidden">
    <div class="diag-head">
      <strong>字段识别结果</strong>
      <button id="closeDiag" class="text-btn">收起</button>
    </div>
    <p id="diagSummary" class="diag-summary"></p>
    <div id="diagList" class="diag-list"></div>
  </section>

  <footer class="foot">
    <span>数据仅保存在本机</span>
    <button id="optionsLink" class="text-btn">编辑简历</button>
  </footer>

  <script src="../shared/schema.js"></script>
  <script src="popup.js"></script>
</body>
</html>
